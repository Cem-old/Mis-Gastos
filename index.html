<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Mis Gastos"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Mis Gastos</title>
<style>:root{--bg:#07111f;--card:#111d2c;--line:#24364b;--text:#f6f8fb;--muted:#8fa3ba;--blue:#1677ff;--green:#20c878;--red:#ff5d5d;--purple:#b792ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#081525,#07111f 45%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;min-height:100vh}.app{max-width:720px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(94px + env(safe-area-inset-bottom))}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.08em}.head h1{margin:2px 0 0;font-size:30px}.total{text-align:right;color:var(--muted);font-size:12px}.total b{display:block;color:white;font-size:24px}.accounts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.card{background:rgba(17,29,44,.92);border:1px solid var(--line);border-radius:18px;padding:15px}.account{min-height:106px}.account .name{font-weight:700}.account .bal{font-size:22px;font-weight:800;margin-top:18px}.account .date{font-size:11px;color:var(--muted);margin-top:4px}.toolbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;position:sticky;top:calc(6px + env(safe-area-inset-top));z-index:3;background:#07111fe8;padding:8px 0}.btn,button{border:0;border-radius:13px;padding:12px 10px;background:#17283b;color:white;font-weight:700;font-size:14px}.primary{background:var(--blue)}.section{display:flex;align-items:center;justify-content:space-between;margin:20px 3px 9px}.section h2{font-size:18px;margin:0}.search{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:#0b1726;color:white;font-size:16px;margin-bottom:10px}.list{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card)}.row{display:grid;grid-template-columns:62px 1fr auto;gap:9px;padding:13px;border-bottom:1px solid var(--line);align-items:center}.row:last-child{border-bottom:0}.date{color:var(--muted);font-size:12px}.desc{font-weight:750}.sub{color:var(--muted);font-size:12px;margin-top:3px}.amount{font-weight:800;text-align:right}.pos{color:var(--green)}.neg{color:#ff7a7a}.adj{color:var(--purple)}.badge{font-size:10px;margin-top:3px;text-align:right}.yes{color:var(--green)}.no{color:#ff8585}.empty{text-align:center;padding:32px;color:var(--muted)}.footer{position:fixed;bottom:0;left:0;right:0;background:#07111ff2;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));text-align:center;color:var(--muted);font-size:11px;z-index:5}dialog{width:min(94vw,520px);max-height:88vh;overflow:auto;border:1px solid var(--line);border-radius:22px;background:#101d2c;color:white;padding:18px}dialog::backdrop{background:#000b}dialog h2{margin:0 0 10px}label{display:block;color:var(--muted);font-size:13px;margin:13px 0 5px}input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#081525;color:white;font-size:16px}textarea{min-height:80px;resize:vertical}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.danger{background:#451b24;color:#ffb3bd}.small{font-size:12px;color:var(--muted)}.more{display:flex;gap:8px;flex-wrap:wrap}.more button{flex:1 1 140px}@media(max-width:430px){.accounts{grid-template-columns:1fr 1fr}.toolbar button{font-size:12px;padding:11px 5px}.row{grid-template-columns:52px 1fr auto;padding:12px 10px}.amount{font-size:14px}}</style></head><body><main class="app"><div class="head"><div><div class="eyebrow">CONTROL PERSONAL</div><h1>Mis Gastos</h1></div><div class="total">SALDO TOTAL<b id="total">0,00 €</b></div></div><div id="accounts" class="accounts"></div><div class="toolbar"><button class="primary" onclick="openMove()">＋ Movimiento</button><button onclick="openTransfer()">↔ Transferir</button><button onclick="openAdjust()">✓ Cuadrar saldo</button></div><div class="section"><h2>Movimientos</h2><button onclick="openAccount()">＋ Cuenta</button></div><input class="search" id="search" placeholder="Buscar concepto o proveedor…" oninput="renderMoves()"><div id="moves" class="list"></div><div class="section"><h2>Datos</h2></div><div class="more"><button onclick="exportData()">Exportar copia</button><button onclick="document.getElementById('importFile').click()">Importar copia</button><input id="importFile" type="file" accept="application/json,.json" hidden onchange="importData(event)"></div></main><div class="footer">Cem 2026 · v2.0 iPhone</div>
<dialog id="accountDlg"><form id="accountForm"><h2>Nueva cuenta</h2><label>Nombre</label><input id="aname" required><label>Saldo inicial</label><input id="astart" inputmode="decimal" type="number" step=".01" value="0" required><label>Fecha inicial</label><input id="adate" type="date" required><div class="actions"><button type="button" onclick="accountDlg.close()">Cancelar</button><button class="primary">Guardar</button></div></form></dialog>
<dialog id="moveDlg"><form id="moveForm"><h2 id="moveTitle">Movimiento</h2><input id="mid" type="hidden"><label>Cuenta</label><select id="maccount" required></select><label>Tipo</label><select id="mtype"><option value="expense">Gasto</option><option value="income">Ingreso</option></select><label>Fecha</label><input id="mdate" type="date" required><label>Concepto</label><input id="mdesc" required><label>Proveedor</label><input id="mprovider" list="providers" autocomplete="off" placeholder="Escribe o selecciona"><datalist id="providers"></datalist><label>Importe</label><input id="mamount" inputmode="decimal" type="number" min="0" step=".01" required><label>Cuadre</label><select id="mreconciled"><option value="no">No</option><option value="yes">Sí</option></select><label>Notas</label><textarea id="mnotes" placeholder="Opcional"></textarea><div class="actions"><button id="delbtn" class="danger" type="button" onclick="deleteMove()" style="display:none">Eliminar</button><button type="button" onclick="moveDlg.close()">Cancelar</button><button class="primary">Guardar</button></div></form></dialog>
<dialog id="transferDlg"><form id="transferForm"><h2 id="transferTitle">Transferencia</h2><input id="tid" type="hidden"><label>Desde</label><select id="tfrom" required></select><label>Hacia</label><select id="tto" required></select><label>Fecha</label><input id="tdate" type="date" required><label>Importe</label><input id="tamount" inputmode="decimal" type="number" min=".01" step=".01" required><label>Concepto</label><input id="tdesc" value="Transferencia"><label>Cuadre</label><select id="treconciled"><option value="no">No</option><option value="yes">Sí</option></select><div class="actions"><button id="tdel" class="danger" type="button" onclick="deleteTransfer()" style="display:none">Eliminar</button><button type="button" onclick="transferDlg.close()">Cancelar</button><button class="primary">Guardar</button></div></form></dialog>
<dialog id="adjustDlg"><form id="adjustForm"><h2>Ajustar saldo real</h2><p class="small">Se creará automáticamente un asiento por la diferencia entre el saldo teórico y el saldo real en esa fecha.</p><label>Cuenta</label><select id="jaccount" required></select><label>Fecha del saldo real</label><input id="jdate" type="date" required><label>Saldo real</label><input id="jreal" inputmode="decimal" type="number" step=".01" required><label>Cuadre del ajuste</label><select id="jreconciled"><option value="yes">Sí</option><option value="no">No</option></select><div class="actions"><button type="button" onclick="adjustDlg.close()">Cancelar</button><button class="primary">Crear ajuste</button></div></form></dialog>
<script>const KEY='mis_gastos_v2';let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!db)db={accounts:[],moves:[]};const $=x=>document.getElementById(x),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8),today=()=>new Date().toISOString().slice(0,10),money=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function signed(m){return ['expense','transferOut'].includes(m.type)?-Math.abs(m.amount):Math.abs(m.amount)}function balanceAt(id,date='9999-12-31'){let a=db.accounts.find(x=>x.id===id);if(!a)return 0;let n=a.startDate<=date?Number(a.start):0;db.moves.filter(m=>m.account===id&&m.date<=date).forEach(m=>n+=signed(m));return n}function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function selects(){['maccount','tfrom','tto','jaccount'].forEach(id=>$(id).innerHTML=db.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join(''));let p=[...new Set(db.moves.map(m=>m.provider).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));$('providers').innerHTML=p.map(x=>`<option value="${esc(x)}"></option>`).join('')}function render(){selects();$('total').textContent=money(db.accounts.reduce((s,a)=>s+balanceAt(a.id),0));$('accounts').innerHTML=db.accounts.length?db.accounts.map(a=>`<div class="card account"><div class="name">${esc(a.name)}</div><div class="bal">${money(balanceAt(a.id))}</div><div class="date">Saldo desde ${a.startDate.split('-').reverse().join('/')}</div></div>`).join(''):'<div class="card account"><div class="name">Empieza aquí</div><div class="date">Crea tu primera cuenta</div></div>';renderMoves()}function renderMoves(){let q=($('search').value||'').toLowerCase();let arr=[...db.moves].filter(m=>((m.desc||'')+' '+(m.provider||'')).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0));$('moves').innerHTML=arr.length?arr.map(m=>{let a=db.accounts.find(x=>x.id===m.account),v=signed(m),cl=m.type==='adjust'?'adj':v>=0?'pos':'neg',lab={expense:'Gasto',income:'Ingreso',adjust:'Ajuste',transferOut:'Transferencia',transferIn:'Transferencia'}[m.type]||m.type;return `<div class="row" onclick="editAny('${m.id}')"><div><div class="date">${m.date.slice(8,10)}/${m.date.slice(5,7)}</div><div class="sub">${lab}</div></div><div><div class="desc">${esc(m.desc)}</div><div class="sub">${esc(a?.name||'Cuenta')}${m.provider?' · '+esc(m.provider):''}</div></div><div><div class="amount ${cl}">${v>=0?'+':''}${money(v)}</div><div class="badge ${m.reconciled==='yes'?'yes':'no'}">Cuadre: ${m.reconciled==='yes'?'Sí':'No'}</div></div></div>`}).join(''):'<div class="empty">No hay movimientos</div>'}function openAccount(){$('adate').value=today();accountDlg.showModal()}accountForm.onsubmit=e=>{e.preventDefault();db.accounts.push({id:uid(),name:$('aname').value.trim(),start:Number($('astart').value),startDate:$('adate').value});accountForm.reset();accountDlg.close();save()};function openMove(){if(!db.accounts.length)return alert('Primero crea una cuenta.');$('mid').value='';$('moveTitle').textContent='Nuevo movimiento';$('delbtn').style.display='none';$('mtype').disabled=false;$('mdate').value=today();$('mdesc').value='';$('mprovider').value='';$('mamount').value='';$('mreconciled').value='no';$('mnotes').value='';moveDlg.showModal()}moveForm.onsubmit=e=>{e.preventDefault();let id=$('mid').value,o={account:$('maccount').value,type:$('mtype').value,date:$('mdate').value,desc:$('mdesc').value.trim(),provider:$('mprovider').value.trim(),amount:Number($('mamount').value),reconciled:$('mreconciled').value,notes:$('mnotes').value.trim()};if(id){let i=db.moves.findIndex(m=>m.id===id);db.moves[i]={...db.moves[i],...o}}else db.moves.push({id:uid(),...o,created:Date.now()});moveDlg.close();save()};function editAny(id){let m=db.moves.find(x=>x.id===id);if(!m)return;if(m.transferId)return editTransfer(m.transferId);$('mid').value=id;$('moveTitle').textContent='Editar movimiento';$('maccount').value=m.account;$('mtype').value=m.type==='adjust'?'income':m.type;$('mtype').disabled=m.type==='adjust';$('mdate').value=m.date;$('mdesc').value=m.desc;$('mprovider').value=m.provider||'';$('mamount').value=Math.abs(m.amount);$('mreconciled').value=m.reconciled||'no';$('mnotes').value=m.notes||'';$('delbtn').style.display='block';moveDlg.showModal()}function deleteMove(){let id=$('mid').value;if(confirm('¿Eliminar este movimiento?')){db.moves=db.moves.filter(m=>m.id!==id);moveDlg.close();save()}}function openTransfer(){if(db.accounts.length<2)return alert('Necesitas al menos dos cuentas.');$('tid').value='';$('transferTitle').textContent='Transferencia';$('tdel').style.display='none';$('tdate').value=today();$('tamount').value='';$('tdesc').value='Transferencia';$('treconciled').value='no';transferDlg.showModal()}function editTransfer(x){let ms=db.moves.filter(m=>m.transferId===x),out=ms.find(m=>m.type==='transferOut'),inn=ms.find(m=>m.type==='transferIn');if(!out||!inn)return;$('tid').value=x;$('transferTitle').textContent='Editar transferencia';$('tfrom').value=out.account;$('tto').value=inn.account;$('tdate').value=out.date;$('tamount').value=Math.abs(out.amount);$('tdesc').value=out.desc;$('treconciled').value=out.reconciled||'no';$('tdel').style.display='block';transferDlg.showModal()}transferForm.onsubmit=e=>{e.preventDefault();if($('tfrom').value===$('tto').value)return alert('Selecciona cuentas distintas.');let x=$('tid').value||uid(),am=Number($('tamount').value),d=$('tdate').value,ds=$('tdesc').value.trim()||'Transferencia',r=$('treconciled').value,c=Date.now();db.moves=db.moves.filter(m=>m.transferId!==x);db.moves.push({id:uid(),transferId:x,account:$('tfrom').value,type:'transferOut',date:d,desc:ds,amount:am,reconciled:r,created:c},{id:uid(),transferId:x,account:$('tto').value,type:'transferIn',date:d,desc:ds,amount:am,reconciled:r,created:c});transferDlg.close();save()};function deleteTransfer(){let x=$('tid').value;if(confirm('¿Eliminar esta transferencia de ambas cuentas?')){db.moves=db.moves.filter(m=>m.transferId!==x);transferDlg.close();save()}}function openAdjust(){if(!db.accounts.length)return alert('Primero crea una cuenta.');$('jdate').value=today();$('jreconciled').value='yes';adjustDlg.showModal()}adjustForm.onsubmit=e=>{e.preventDefault();let id=$('jaccount').value,d=$('jdate').value,real=Number($('jreal').value),theory=balanceAt(id,d),diff=real-theory;if(Math.abs(diff)<.005)return alert('El saldo ya coincide.');db.moves.push({id:uid(),account:id,type:'adjust',date:d,desc:'Ajuste de saldo',provider:'',amount:diff,reconciled:$('jreconciled').value,notes:`Saldo teórico ${money(theory)} · saldo real ${money(real)}`,created:Date.now()});adjustDlg.close();save()};function exportData(){let blob=new Blob([JSON.stringify({app:'Mis Gastos',version:'2.0',exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Mis_Gastos_copia_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result),d=x.data||x;if(!Array.isArray(d.accounts)||!Array.isArray(d.moves))throw 0;if(confirm('La copia sustituirá los datos actuales. ¿Continuar?')){db=d;save();alert('Copia restaurada correctamente.')}}catch(_){alert('El archivo no es una copia válida de Mis Gastos.')}e.target.value=''};r.readAsText(f)}if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();</script></body></html>
