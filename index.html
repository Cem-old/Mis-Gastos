<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Mis Gastos"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Mis Gastos v2.1</title>
<style>:root{--bg:#07111f;--card:#111d2c;--line:#24364b;--text:#f6f8fb;--muted:#8fa3ba;--blue:#1677ff;--green:#20c878;--red:#ff5d5d;--purple:#b792ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#081525,#07111f 45%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;min-height:100vh}.app{max-width:720px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(94px + env(safe-area-inset-bottom))}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.08em}.head h1{margin:2px 0 0;font-size:30px}.total{text-align:right;color:var(--muted);font-size:12px}.total b{display:block;color:white;font-size:24px}.accounts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.card{background:rgba(17,29,44,.92);border:1px solid var(--line);border-radius:18px;padding:15px}.account{min-height:106px}.account .name{font-weight:700}.account .bal{font-size:22px;font-weight:800;margin-top:18px}.account .date{font-size:11px;color:var(--muted);margin-top:4px}.toolbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;position:sticky;top:calc(6px + env(safe-area-inset-top));z-index:3;background:#07111fe8;padding:8px 0}.btn,button{border:0;border-radius:13px;padding:12px 10px;background:#17283b;color:white;font-weight:700;font-size:14px}.primary{background:var(--blue)}.section{display:flex;align-items:center;justify-content:space-between;margin:20px 3px 9px}.section h2{font-size:18px;margin:0}.search{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:#0b1726;color:white;font-size:16px;margin-bottom:10px}.list{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card)}.row{display:grid;grid-template-columns:62px 1fr auto;gap:9px;padding:13px;border-bottom:1px solid var(--line);align-items:center}.row:last-child{border-bottom:0}.date{color:var(--muted);font-size:12px}.desc{font-weight:750}.sub{color:var(--muted);font-size:12px;margin-top:3px}.amount{font-weight:800;text-align:right}.pos{color:var(--green)}.neg{color:#ff7a7a}.adj{color:var(--purple)}.badge{font-size:10px;margin-top:3px;text-align:right}.yes{color:var(--green)}.no{color:#ff8585}
.tabs{display:flex;gap:7px;margin:0 0 10px}.tab{flex:1;background:#102033;color:var(--muted);border:1px solid var(--line)}.tab.active{background:#183b68;color:white;border-color:#2d69aa}.count{display:inline-block;min-width:22px;padding:2px 6px;border-radius:999px;background:#0a1727;font-size:11px;margin-left:4px}
.switch{position:relative;width:50px;height:30px;display:inline-block;vertical-align:middle}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#314256;border-radius:999px;transition:.18s;border:1px solid #42566d}.slider:before{content:"";position:absolute;width:24px;height:24px;left:2px;top:2px;background:white;border-radius:50%;transition:.18s;box-shadow:0 1px 5px #0008}.switch input:checked+.slider{background:var(--green);border-color:var(--green)}.switch input:checked+.slider:before{transform:translateX(20px)}
.bulkbar{display:none;gap:8px;align-items:center;margin:0 0 10px;padding:10px;border:1px solid var(--line);background:#0d1c2d;border-radius:14px}.bulkbar.show{display:flex}.bulkbar button{padding:9px 10px}.bulkbar .small{flex:1}.selectbox{width:22px;height:22px;accent-color:var(--blue)}.empty{text-align:center;padding:32px;color:var(--muted)}.footer{position:fixed;bottom:0;left:0;right:0;background:#07111ff2;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));text-align:center;color:var(--muted);font-size:11px;z-index:5}dialog{width:min(94vw,520px);max-height:88vh;overflow:auto;border:1px solid var(--line);border-radius:22px;background:#101d2c;color:white;padding:18px}dialog::backdrop{background:#000b}dialog h2{margin:0 0 10px}label{display:block;color:var(--muted);font-size:13px;margin:13px 0 5px}input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#081525;color:white;font-size:16px}textarea{min-height:80px;resize:vertical}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.danger{background:#451b24;color:#ffb3bd}.small{font-size:12px;color:var(--muted)}.more{display:flex;gap:8px;flex-wrap:wrap}.more button{flex:1 1 140px}@media(max-width:430px){.accounts{grid-template-columns:1fr 1fr}.toolbar button{font-size:12px;padding:11px 5px}.row{grid-template-columns:52px 1fr auto;padding:12px 10px}.amount{font-size:14px}}</style></head><body><main class="app"><div class="head"><div><div class="eyebrow">CONTROL PERSONAL</div><h1>Mis Gastos</h1></div><div class="total">SALDO TOTAL<b id="total">0,00 €</b></div></div><div id="accounts" class="accounts"></div><div class="toolbar"><button class="primary" onclick="openMove()">＋ Movimiento</button><button onclick="openTransfer()">↔ Transferir</button><button onclick="openAdjust()">✓ Cuadrar saldo</button></div><div class="section"><h2>Movimientos</h2><button onclick="openAccount()">＋ Cuenta</button></div>
<div class="tabs"><button id="tabPending" class="tab active" onclick="setView('pending')">Pendientes <span id="pendingCount" class="count">0</span></button><button id="tabPast" class="tab" onclick="setView('past')">Anteriores</button></div>
<input class="search" id="search" placeholder="Buscar concepto o proveedor…" oninput="renderMoves()">
<div id="bulkbar" class="bulkbar"><input id="selectAll" class="selectbox" type="checkbox" onchange="toggleAll(this.checked)"><span id="selectedText" class="small">0 seleccionados</span><button onclick="markSelectedPast()">Marcar como pasados</button></div>
<div id="moves" class="list"></div><div class="section"><h2>Datos</h2></div><div class="more"><button onclick="exportData()">Exportar copia</button><button onclick="document.getElementById('importFile').click()">Importar copia</button><input id="importFile" type="file" accept="application/json,.json" hidden onchange="importData(event)"></div></main><div class="footer">Cem 2026 · v2.1 iPhone</div>
<dialog id="accountDlg"><form id="accountForm"><h2>Nueva cuenta</h2><label>Nombre</label><input id="aname" required><label>Saldo inicial</label><input id="astart" inputmode="decimal" type="number" step=".01" value="0" required><label>Fecha inicial</label><input id="adate" type="date" required><div class="actions"><button type="button" onclick="accountDlg.close()">Cancelar</button><button class="primary">Guardar</button></div></form></dialog>
<dialog id="moveDlg"><form id="moveForm"><h2 id="moveTitle">Movimiento</h2><input id="mid" type="hidden"><label>Cuenta</label><select id="maccount" required></select><label>Tipo</label><select id="mtype"><option value="expense">Gasto</option><option value="income">Ingreso</option></select><label>Fecha</label><input id="mdate" type="date" required><label>Concepto</label><input id="mdesc" required><label>Proveedor</label><input id="mprovider" list="providers" autocomplete="off" placeholder="Escribe o selecciona"><datalist id="providers"></datalist><label>Importe</label><input id="mamount" inputmode="decimal" type="number" min="0" step=".01" required><label>Notas</label><textarea id="mnotes" placeholder="Opcional"></textarea><div class="actions"><button id="delbtn" class="danger" type="button" onclick="deleteMove()" style="display:none">Eliminar</button><button type="button" onclick="moveDlg.close()">Cancelar</button><button class="primary">Guardar</button></div></form></dialog>
<dialog id="transferDlg"><form id="transferForm"><h2 id="transferTitle">Transferencia</h2><input id="tid" type="hidden"><label>Desde</label><select id="tfrom" required></select><label>Hacia</label><select id="tto" required></select><label>Fecha</label><input id="tdate" type="date" required><label>Importe</label><input id="tamount" inputmode="decimal" type="number" min=".01" step=".01" required><label>Concepto</label><input id="tdesc" value="Transferencia"><div class="actions"><button id="tdel" class="danger" type="button" onclick="deleteTransfer()" style="display:none">Eliminar</button><button type="button" onclick="transferDlg.close()">Cancelar</button><button class="primary">Guardar</button></div></form></dialog>
<dialog id="adjustDlg"><form id="adjustForm"><h2>Ajustar saldo real</h2><p class="small">Se creará automáticamente un asiento por la diferencia entre el saldo teórico y el saldo real en esa fecha.</p><label>Cuenta</label><select id="jaccount" required></select><label>Fecha del saldo real</label><input id="jdate" type="date" required><label>Saldo real</label><input id="jreal" inputmode="decimal" type="number" step=".01" required><div class="actions"><button type="button" onclick="adjustDlg.close()">Cancelar</button><button class="primary">Crear ajuste</button></div></form></dialog>
<script>
const KEY='mis_gastos_v2';
let db; try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
if(!db) db={accounts:[],moves:[]};
db.accounts=db.accounts||[]; db.moves=db.moves||[];
db.moves.forEach(m=>{ if(!m.reconciled) m.reconciled='no'; });
let moveView='pending', selected=new Set();

const $=x=>document.getElementById(x),
uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8),
today=()=>new Date().toISOString().slice(0,10),
money=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'}),
esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function signed(m){return ['expense','transferOut'].includes(m.type)?-Math.abs(m.amount):Math.abs(m.amount)}

/* A balance adjustment is a dated snapshot. Once a real balance has been
   recorded, later entry of older/same-date transactions must not change it. */
function latestSnapshot(accountId,date='9999-12-31'){
  return db.moves.filter(m=>m.account===accountId && m.type==='adjust' && m.date<=date && Number.isFinite(Number(m.realBalance)))
    .sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0))[0]||null;
}
function balanceAt(id,date='9999-12-31'){
  const a=db.accounts.find(x=>x.id===id); if(!a)return 0;
  const snap=latestSnapshot(id,date);
  if(snap){
    let n=Number(snap.realBalance);
    db.moves.filter(m=>m.account===id && m.type!=='adjust' && m.date>snap.date && m.date<=date).forEach(m=>n+=signed(m));
    return n;
  }
  let n=a.startDate<=date?Number(a.start):0;
  db.moves.filter(m=>m.account===id && m.type!=='adjust' && m.date<=date).forEach(m=>n+=signed(m));
  // Compatibility with old v2.0 adjustments that did not store a snapshot
  db.moves.filter(m=>m.account===id && m.type==='adjust' && !Number.isFinite(Number(m.realBalance)) && m.date<=date).forEach(m=>n+=signed(m));
  return n;
}
function theoreticalBeforeNewSnapshot(id,date){
  return balanceAt(id,date);
}
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function selects(){
  ['maccount','tfrom','tto','jaccount'].forEach(id=>$(id).innerHTML=db.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join(''));
  let p=[...new Set(db.moves.map(m=>m.provider).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
  $('providers').innerHTML=p.map(x=>`<option value="${esc(x)}"></option>`).join('');
}
function render(){
  selects();
  $('total').textContent=money(db.accounts.reduce((s,a)=>s+balanceAt(a.id),0));
  $('accounts').innerHTML=db.accounts.length?db.accounts.map(a=>`<div class="card account"><div class="name">${esc(a.name)}</div><div class="bal">${money(balanceAt(a.id))}</div><div class="date">Saldo desde ${a.startDate.split('-').reverse().join('/')}</div></div>`).join(''):'<div class="card account"><div class="name">Empieza aquí</div><div class="date">Crea tu primera cuenta</div></div>';
  renderMoves();
}
function setView(v){
  moveView=v; selected.clear();
  $('tabPending').classList.toggle('active',v==='pending');
  $('tabPast').classList.toggle('active',v==='past');
  renderMoves();
}
function setReconciled(id,yes,event){
  if(event) event.stopPropagation();
  let m=db.moves.find(x=>x.id===id); if(!m)return;
  const val=yes?'yes':'no';
  if(m.transferId) db.moves.filter(x=>x.transferId===m.transferId).forEach(x=>x.reconciled=val);
  else m.reconciled=val;
  save();
}
function toggleSelected(id,checked,event){
  if(event)event.stopPropagation();
  checked?selected.add(id):selected.delete(id);
  updateBulk();
}
function toggleAll(checked){
  visiblePendingIds().forEach(id=>checked?selected.add(id):selected.delete(id)); updateBulk();
}
function visiblePendingIds(){
  let q=($('search').value||'').toLowerCase();
  return db.moves.filter(m=>m.type!=='adjust' && m.reconciled!=='yes' && (((m.desc||'')+' '+(m.provider||'')).toLowerCase().includes(q))).map(m=>m.id);
}
function updateBulk(){
  if(!$('bulkbar'))return;
  $('bulkbar').classList.toggle('show',moveView==='pending');
  $('selectedText').textContent=`${selected.size} seleccionado${selected.size===1?'':'s'}`;
  let ids=visiblePendingIds(); $('selectAll').checked=ids.length>0&&ids.every(id=>selected.has(id));
}
function markSelectedPast(){
  if(!selected.size)return alert('Selecciona al menos un movimiento.');
  if(!confirm(`¿Marcar ${selected.size} movimiento${selected.size===1?'':'s'} como pasado${selected.size===1?'':'s'} a la otra contabilidad?`))return;
  const tids=new Set();
  selected.forEach(id=>{let m=db.moves.find(x=>x.id===id);if(m?.transferId)tids.add(m.transferId);else if(m)m.reconciled='yes'});
  db.moves.forEach(m=>{if(tids.has(m.transferId))m.reconciled='yes'});
  selected.clear(); save();
}
function renderMoves(){
  let q=($('search').value||'').toLowerCase();
  let pending=db.moves.filter(m=>m.type!=='adjust'&&m.reconciled!=='yes').length;
  $('pendingCount').textContent=pending;
  let arr=[...db.moves].filter(m=>{
    let match=((m.desc||'')+' '+(m.provider||'')).toLowerCase().includes(q);
    if(!match)return false;
    if(m.type==='adjust') return moveView==='past'; // saldo snapshots live in history
    return moveView==='pending'?m.reconciled!=='yes':m.reconciled==='yes';
  }).sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0));
  $('moves').innerHTML=arr.length?arr.map(m=>{
    let a=db.accounts.find(x=>x.id===m.account),v=signed(m),cl=m.type==='adjust'?'adj':v>=0?'pos':'neg',
    lab={expense:'Gasto',income:'Ingreso',adjust:'Ajuste saldo',transferOut:'Transferencia',transferIn:'Transferencia'}[m.type]||m.type;
    let control='';
    if(m.type!=='adjust'){
      if(moveView==='pending') control=`<div style="display:flex;align-items:center;gap:8px;justify-content:flex-end"><input class="selectbox" type="checkbox" ${selected.has(m.id)?'checked':''} onclick="toggleSelected('${m.id}',this.checked,event)"><label class="switch" onclick="event.stopPropagation()"><input type="checkbox" onchange="setReconciled('${m.id}',this.checked,event)"><span class="slider"></span></label></div>`;
      else control=`<label class="switch" onclick="event.stopPropagation()"><input type="checkbox" checked onchange="setReconciled('${m.id}',this.checked,event)"><span class="slider"></span></label>`;
    }
    return `<div class="row" onclick="editAny('${m.id}')"><div><div class="date">${m.date.slice(8,10)}/${m.date.slice(5,7)}</div><div class="sub">${lab}</div></div><div><div class="desc">${esc(m.desc)}</div><div class="sub">${esc(a?.name||'Cuenta')}${m.provider?' · '+esc(m.provider):''}</div><div class="amount ${cl}" style="text-align:left;margin-top:5px">${v>=0?'+':''}${money(v)}</div></div><div>${control}</div></div>`;
  }).join(''):`<div class="empty">${moveView==='pending'?'No hay movimientos pendientes':'No hay movimientos anteriores'}</div>`;
  updateBulk();
}
function openAccount(){$('adate').value=today();accountDlg.showModal()}
accountForm.onsubmit=e=>{e.preventDefault();db.accounts.push({id:uid(),name:$('aname').value.trim(),start:Number($('astart').value),startDate:$('adate').value});accountForm.reset();accountDlg.close();save()};

function openMove(){
  if(!db.accounts.length)return alert('Primero crea una cuenta.');
  $('mid').value=''; $('moveTitle').textContent='Nuevo movimiento'; $('delbtn').style.display='none'; $('mtype').disabled=false;
  $('mtype').value='expense'; $('mdate').value=today(); $('mdesc').value=''; $('mprovider').value=''; $('mamount').value=''; $('mnotes').value='';
  moveDlg.showModal();
}
moveForm.onsubmit=e=>{
  e.preventDefault();
  let id=$('mid').value,o={account:$('maccount').value,type:$('mtype').value,date:$('mdate').value,desc:$('mdesc').value.trim(),provider:$('mprovider').value.trim(),amount:Number($('mamount').value),notes:$('mnotes').value.trim()};
  if(id){let i=db.moves.findIndex(m=>m.id===id);db.moves[i]={...db.moves[i],...o}}
  else db.moves.push({id:uid(),...o,reconciled:'no',created:Date.now()});
  moveDlg.close();save();
}
function editAny(id){
  let m=db.moves.find(x=>x.id===id);if(!m)return;
  if(m.transferId)return editTransfer(m.transferId);
  if(m.type==='adjust')return alert(`Ajuste de saldo: ${money(m.realBalance ?? 0)} a fecha ${m.date.split('-').reverse().join('/')}. Los ajustes quedan como puntos de referencia del saldo.`);
  $('mid').value=id;$('moveTitle').textContent='Editar movimiento';$('maccount').value=m.account;$('mtype').value=m.type;$('mtype').disabled=false;$('mdate').value=m.date;$('mdesc').value=m.desc;$('mprovider').value=m.provider||'';$('mamount').value=Math.abs(m.amount);$('mnotes').value=m.notes||'';$('delbtn').style.display='block';moveDlg.showModal();
}
function deleteMove(){let id=$('mid').value;if(confirm('¿Eliminar este movimiento?')){db.moves=db.moves.filter(m=>m.id!==id);moveDlg.close();save()}}

function openTransfer(){
  if(db.accounts.length<2)return alert('Necesitas al menos dos cuentas.');
  $('tid').value='';$('transferTitle').textContent='Transferencia';$('tdel').style.display='none';$('tdate').value=today();$('tamount').value='';$('tdesc').value='Transferencia';transferDlg.showModal();
}
function editTransfer(x){
  let ms=db.moves.filter(m=>m.transferId===x),out=ms.find(m=>m.type==='transferOut'),inn=ms.find(m=>m.type==='transferIn');if(!out||!inn)return;
  $('tid').value=x;$('transferTitle').textContent='Editar transferencia';$('tfrom').value=out.account;$('tto').value=inn.account;$('tdate').value=out.date;$('tamount').value=Math.abs(out.amount);$('tdesc').value=out.desc;$('tdel').style.display='block';transferDlg.showModal();
}
transferForm.onsubmit=e=>{
  e.preventDefault();if($('tfrom').value===$('tto').value)return alert('Selecciona cuentas distintas.');
  let x=$('tid').value||uid(),old=db.moves.find(m=>m.transferId===x),r=old?.reconciled||'no',am=Number($('tamount').value),d=$('tdate').value,ds=$('tdesc').value.trim()||'Transferencia',c=old?.created||Date.now();
  db.moves=db.moves.filter(m=>m.transferId!==x);
  db.moves.push({id:uid(),transferId:x,account:$('tfrom').value,type:'transferOut',date:d,desc:ds,amount:am,reconciled:r,created:c},{id:uid(),transferId:x,account:$('tto').value,type:'transferIn',date:d,desc:ds,amount:am,reconciled:r,created:c});
  transferDlg.close();save();
}
function deleteTransfer(){let x=$('tid').value;if(confirm('¿Eliminar esta transferencia de ambas cuentas?')){db.moves=db.moves.filter(m=>m.transferId!==x);transferDlg.close();save()}}

function openAdjust(){if(!db.accounts.length)return alert('Primero crea una cuenta.');$('jdate').value=today();adjustDlg.showModal()}
adjustForm.onsubmit=e=>{
  e.preventDefault();
  let id=$('jaccount').value,d=$('jdate').value,real=Number($('jreal').value),theory=theoreticalBeforeNewSnapshot(id,d),diff=real-theory;
  db.moves.push({id:uid(),account:id,type:'adjust',date:d,desc:'Ajuste de saldo',provider:'',amount:diff,realBalance:real,reconciled:'yes',notes:`Saldo teórico ${money(theory)} · saldo real ${money(real)}`,created:Date.now()});
  adjustDlg.close();save();
}
function exportData(){
  let blob=new Blob([JSON.stringify({app:'Mis Gastos',version:'2.1',exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='Mis_Gastos_copia_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)
}
function importData(e){
  let f=e.target.files[0];if(!f)return;let r=new FileReader;
  r.onload=()=>{try{let x=JSON.parse(r.result),d=x.data||x;if(!Array.isArray(d.accounts)||!Array.isArray(d.moves))throw 0;if(confirm('La copia sustituirá los datos actuales. ¿Continuar?')){db=d;db.moves.forEach(m=>{if(!m.reconciled)m.reconciled='no'});save();alert('Copia restaurada correctamente.')}}catch(_){alert('El archivo no es una copia válida de Mis Gastos.')}e.target.value=''};
  r.readAsText(f)
}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script></body></html>
